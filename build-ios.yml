# Сборка iOS-приложения БЕЗ собственного Mac.
# GitHub предоставляет macOS-машины бесплатно для публичных репозиториев.
# Результат — неподписанный .ipa, который ставится через AltStore/SideStore.

name: Build Magic Hub IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # кнопка «Run workflow» вручную

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект Xcode
        run: xcodegen generate

      - name: Собрать приложение (без подписи)
        run: |
          xcodebuild \
            -project MagicHub.xcodeproj \
            -scheme MagicHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            clean build

      - name: Упаковать в IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MagicHub.app Payload/
          zip -qr MagicHub.ipa Payload
          ls -la MagicHub.ipa

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MagicHub-ipa
          path: MagicHub.ipa
          retention-days: 30

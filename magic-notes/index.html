<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Magic Notes</title>
<style>
  :root{--bg:#0d0f14;--card:#171a22;--line:#262b36;--tx:#e8ecf3;--dim:#8b94a6;--acc:#4c8dff;--ok:#37d67a;--warn:#ffb020}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{position:sticky;top:0;background:rgba(13,15,20,.95);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10}
  h1{font-size:17px;margin:0;flex:1;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .bat{font-size:12px;color:var(--dim)}
  main{padding:14px 16px 120px;max-width:640px;margin:0 auto}
  .btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;
       padding:12px 16px;font-size:15px;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.97)}
  .btn.acc{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.sm{padding:8px 12px;font-size:13px}
  .row{display:flex;gap:8px;align-items:center}
  .note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
  .note.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(76,141,255,.25)}
  .note h3{margin:0 0 4px;font-size:16px;font-weight:600}
  .note p{margin:0;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hint{color:var(--dim);font-size:13px;margin:10px 0}
  input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
                 padding:12px;color:var(--tx);font:inherit;margin-bottom:10px}
  textarea{min-height:140px;resize:vertical}
  .word{font-size:clamp(30px,11vw,58px);font-weight:700;text-align:center;margin:26px 0 8px;word-break:break-word}
  .pos{text-align:center;color:var(--dim);font-size:14px}
  .num{font-size:clamp(60px,26vw,140px);font-weight:800;text-align:center;margin:18px 0;letter-spacing:-2px}
  .pad{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,20,.97);backdrop-filter:blur(8px);
       border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
       display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:0 auto}
  .pad .btn{padding:14px 4px;font-size:13px;text-align:center}
  .banner{background:#2a1d0b;border:1px solid #573a10;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .hide{display:none!important}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1 id="title">Magic Notes</h1>
  <span class="bat" id="bat"></span>
  <button class="btn sm" id="btnConn">Пульт</button>
</header>

<main>
  <div class="banner hide" id="banner"></div>

  <!-- ЭКРАН: СПИСОК -->
  <section id="scList">
    <div class="row" style="margin-bottom:12px">
      <button class="btn acc" id="btnNew" style="flex:1">+ Новая заметка</button>
      <button class="btn" id="btnPredict">🔮</button>
    </div>
    <div id="list"></div>
    <p class="hint" id="listHint"></p>
  </section>

  <!-- ЭКРАН: РЕДАКТОР -->
  <section id="scEdit" class="hide">
    <input id="edTitle" placeholder="Название">
    <textarea id="edBody" placeholder="Текст заметки…"></textarea>
    <div class="row">
      <button class="btn acc" id="btnSave" style="flex:1">Сохранить</button>
      <button class="btn" id="btnDel">Удалить</button>
      <button class="btn" id="btnCancel">Отмена</button>
    </div>
  </section>

  <!-- ЭКРАН: ПРОСМОТР / ПОДГЛЯДЫВАНИЕ -->
  <section id="scView" class="hide">
    <h2 id="vwTitle" style="font-size:16px;margin:0 0 4px"></h2>
    <div class="word" id="vwWord">—</div>
    <div class="pos" id="vwPos"></div>
    <p class="hint" id="vwFull" style="margin-top:22px"></p>
  </section>

  <!-- ЭКРАН: ПРЕДСКАЗАНИЕ -->
  <section id="scPredict" class="hide">
    <div class="num" id="prNum">50</div>
    <div class="pos" id="prState">крутите значение</div>
  </section>
</main>

<!-- Экранные кнопки = полный аналог пульта (приложение работает без S3) -->
<div class="pad">
  <button class="btn" data-b="1">▲<br><small id="lb1">вверх</small></button>
  <button class="btn" data-b="2">▼<br><small id="lb2">вниз</small></button>
  <button class="btn" data-b="3">●<br><small id="lb3">выбрать</small></button>
  <button class="btn" data-b="4">←<br><small id="lb4">назад</small></button>
</div>

<script src="magic-sdk.js"></script>
<script>
/* ===================== СОСТОЯНИЕ ПРИЛОЖЕНИЯ ===================== */
const APP_ID = 'notes';
let notes = [];
let sel = 0;              // индекс выбранной заметки в списке
let mode = 'list';        // list | edit | view | predict
let editId = null;
let words = [], wi = 0;   // подглядывание по словам
let predict = 50, locked = false;

const $ = id => document.getElementById(id);
const LS = 'magic_notes_v1';

function load(){
  try { notes = JSON.parse(localStorage.getItem(LS)) || []; } catch(e){ notes = []; }
  if (!notes.length) {
    notes = [
      {id:1, title:'Список покупок', body:'молоко хлеб сыр яблоки кофе'},
      {id:2, title:'Пароль от сейфа', body:'семь три девять два'},
      {id:3, title:'Идея для трюка', body:'зритель называет число и оно уже записано'}
    ];
    save();
  }
}
function save(){ localStorage.setItem(LS, JSON.stringify(notes)); }

/* ===================== ОТРИСОВКА ===================== */
function show(sc){
  ['scList','scEdit','scView','scPredict'].forEach(x => $(x).classList.add('hide'));
  $(sc).classList.remove('hide');
}

const LABELS = {
  list:    ['вверх','вниз','открыть','🔮 предск.'],
  view:    ['пред.слово','след.слово','в начало','назад'],
  predict: ['+1','−1', 'зафикс.','назад'],
  edit:    ['—','—','—','отмена']
};

function render(){
  // подписи кнопок под текущий режим
  const L = LABELS[mode] || LABELS.list;
  for (let i=0;i<4;i++) $('lb'+(i+1)).textContent = L[i];

  if (mode === 'list') {
    show('scList');
    $('title').textContent = 'Magic Notes';
    $('list').innerHTML = notes.map((n,i) =>
      `<div class="note ${i===sel?'sel':''}" data-i="${i}">
         <h3>${esc(n.title||'Без названия')}</h3>
         <p>${esc(n.body||'')}</p>
       </div>`).join('') || '<p class="hint">Заметок пока нет</p>';
    $('listHint').textContent = notes.length ? `${sel+1} из ${notes.length}` : '';
    pushDisplay(String(sel+1), notes[sel] ? notes[sel].title : 'пусто');
  }
  else if (mode === 'view') {
    show('scView');
    const n = notes[sel];
    $('title').textContent = 'Просмотр';
    $('vwTitle').textContent = n ? n.title : '';
    $('vwWord').textContent = words[wi] || '—';
    $('vwPos').textContent = words.length ? `${wi+1} / ${words.length}` : '';
    $('vwFull').textContent = n ? n.body : '';
    pushDisplay(words[wi] || '', words.length ? `${wi+1}/${words.length}` : '');
  }
  else if (mode === 'predict') {
    show('scPredict');
    $('title').textContent = 'Предсказание';
    $('prNum').textContent = predict;
    $('prState').textContent = locked ? '✓ зафиксировано' : 'крутите значение';
    pushDisplay(String(predict), locked ? 'LOCKED' : 'predict');
  }
  else if (mode === 'edit') {
    show('scEdit');
    $('title').textContent = 'Редактор';
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===================== ЛОГИКА ДЕЙСТВИЙ =====================
   Одни и те же действия вызываются и с пульта, и с экранных кнопок. */
function doAction(btn, gesture){
  if (gesture === 'long' && btn === 4) { mode='list'; render(); return; }

  if (mode === 'list') {
    if (!notes.length && btn !== 4) return;
    if (btn === 1) sel = (sel - 1 + notes.length) % notes.length;
    if (btn === 2) sel = (sel + 1) % notes.length;
    if (btn === 3) openView();
    if (btn === 4) { mode='predict'; locked=false; }
  }
  else if (mode === 'view') {
    if (btn === 1 && wi > 0) wi--;
    if (btn === 2 && wi < words.length-1) wi++;
    if (btn === 3) wi = 0;
    if (btn === 4) mode = 'list';
  }
  else if (mode === 'predict') {
    if (btn === 1 && !locked) predict = Math.min(100, predict+1);
    if (btn === 2 && !locked) predict = Math.max(1, predict-1);
    if (btn === 3) locked = !locked;
    if (btn === 4) mode = 'list';
  }
  else if (mode === 'edit') {
    if (btn === 4) { mode='list'; }
  }
  render();
}

function openView(){
  const n = notes[sel]; if (!n) return;
  words = (n.body||'').split(/\s+/).filter(Boolean);
  wi = 0; mode = 'view';
}

/* ===================== СВЯЗЬ С ПУЛЬТОМ (необязательная) ===================== */
function pushDisplay(l1, l2){
  if (Magic.connected) {
    Magic.setContext(APP_ID, mode);
    Magic.display(l1, l2);
  }
}

Magic.onCommand(cmd => {
  if (cmd.type === 'combo') {                 // комбо двух кнопок = быстрый сброс
    mode='list'; sel=0; locked=false; predict=50; render(); return;
  }
  if (cmd.type === 'double' && cmd.button === 3) {  // двойное нажатие (собрано в SDK)
    mode = 'predict'; locked = false; render(); return;
  }
  doAction(cmd.button, cmd.type);
});

Magic.onStatus(s => {
  $('dot').classList.toggle('on', Magic.connected);
  if (s.state === 'connected') {
    banner('Пульт подключён. Кнопки S3 управляют приложением.', 2500);
    $('btnConn').textContent = 'Откл.';
    setTimeout(() => { Magic.setContext(APP_ID, mode); render(); }, 300);
  }
  if (s.state === 'disconnected') {
    banner('Пульт отключён — приложение продолжает работать.', 2500);
    $('btnConn').textContent = 'Пульт';
  }
  if (s.state === 'heartbeat') {
    $('bat').textContent = (s.battery != null ? s.battery + '%' : '');
  }
});

function banner(text, ms){
  const b = $('banner'); b.textContent = text; b.classList.remove('hide');
  if (ms) setTimeout(() => b.classList.add('hide'), ms);
}

/* ===================== СОБЫТИЯ UI ===================== */
document.querySelectorAll('.pad .btn').forEach(b => {
  let timer = null, longFired = false;
  const btn = +b.dataset.b;
  const start = () => { longFired=false; timer = setTimeout(()=>{ longFired=true; doAction(btn,'long'); }, 600); };
  const end   = () => { clearTimeout(timer); if(!longFired) doAction(btn,'short'); };
  b.addEventListener('touchstart', e => { e.preventDefault(); start(); }, {passive:false});
  b.addEventListener('touchend',   e => { e.preventDefault(); end();   }, {passive:false});
  b.addEventListener('mousedown', start);
  b.addEventListener('mouseup',   end);
});

$('list').addEventListener('click', e => {
  const el = e.target.closest('.note'); if (!el) return;
  sel = +el.dataset.i; openView(); render();
});

$('btnConn').addEventListener('click', async () => {
  if (Magic.connected) { await Magic.disconnect(); return; }
  try { await Magic.connect(); }
  catch (err) { banner('Не удалось подключиться: ' + err.message, 6000); }
});

$('btnNew').addEventListener('click', () => {
  editId = null; $('edTitle').value=''; $('edBody').value=''; mode='edit'; render();
});
$('btnPredict').addEventListener('click', () => { mode='predict'; locked=false; render(); });
$('btnSave').addEventListener('click', () => {
  const t = $('edTitle').value.trim(), b = $('edBody').value.trim();
  if (!t && !b) { mode='list'; render(); return; }
  if (editId) { const n = notes.find(x=>x.id===editId); n.title=t; n.body=b; }
  else { notes.push({id:Date.now(), title:t, body:b}); sel = notes.length-1; }
  save(); mode='list'; render();
});
$('btnDel').addEventListener('click', () => {
  if (notes[sel]) { notes.splice(sel,1); if (sel>=notes.length) sel=Math.max(0,notes.length-1); save(); }
  mode='list'; render();
});
$('btnCancel').addEventListener('click', () => { mode='list'; render(); });

/* ===================== СТАРТ ===================== */
load();
if (!Magic.isSupported()) {
  banner('Этот браузер не поддерживает Web Bluetooth. Приложение работает автономно. Для пульта откройте страницу в браузере Bluefy (iOS) или Chrome.', 0);
  $('btnConn').style.opacity = .4;
}
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
